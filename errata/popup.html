<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; font-family: -apple-system, "Segoe UI", Arial, sans-serif; margin: 0; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    button {
      width: 100%; border: none; border-radius: 6px; padding: 9px;
      font-size: 13px; cursor: pointer; margin-bottom: 8px;
    }
    #start { background: #e11d48; color: #fff; font-weight: 600; }
    #report { background: #e5e7eb; color: #374151; }
    #count { font-size: 12px; color: #6b7280; text-align: center; }
    #err { font-size: 12px; color: #e11d48; margin-top: 4px; display: none; }
  </style>
</head>
<body>
  <h1>Errata</h1>
  <button id="start">Pick text on this page</button>
  <button id="report">Open report / export</button>
  <div id="count"></div>
  <div id="err">Not available on this page (chrome://, Web Store, PDFs).</div>
  <script src="popup.js"></script>
</body>
</html>
